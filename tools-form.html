// ═══════════════════════════════════════════════════════════════
//  Опросник личных качеств — страница участника (tools_token в URL)
// ═══════════════════════════════════════════════════════════════
var API_URL = window.PVQ_CONFIG && window.PVQ_CONFIG.API_URL;
var API_TIMEOUT_MS = 120000;

async function callApi(action, data) {
  var ctrl = new AbortController();
  var t = setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, API_TIMEOUT_MS);
  try {
    var r = await fetch(API_URL, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action: action }, data || {})),
      signal: ctrl.signal
    });
    clearTimeout(t);
    if (!r.ok) return { ok: false, error: 'HTTP ' + r.status };
    var text = await r.text();
    try { return JSON.parse(text); } catch (e) { return { ok: false, error: text.slice(0, 200) }; }
  } catch (e) {
    clearTimeout(t);
    return { ok: false, error: e && e.name === 'AbortError' ? 'Таймаут запроса — попробуйте снова' : String(e && (e.message || e) || e) };
  }
}

function escH(s) {
  if (s == null || s === '') return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Порядок вопросов перемешивается, но детерминированно от токена —
// чтобы при возврате к незаконченному опросу он не менялся.
function seededShuffle(arr, seed) {
  var a = arr.slice(), s = seed | 1;
  for (var i = a.length - 1; i > 0; i--) {
    s = ((Math.imul ? Math.imul(1664525, s) : (1664525 * s)) + 1013904223) | 0;
    var j = Math.abs(s) % (i + 1), tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
function tokenSeed(token) {
  var h = 0;
  for (var i = 0; i < (token || '').length; i++)
    h = (((Math.imul ? Math.imul(31, h) : (31 * h)) | 0) + token.charCodeAt(i)) | 0;
  return Math.abs(h) || 1;
}

function loadProgress(tk) {
  try { var r = localStorage.getItem('tools_prog_' + tk); return r ? JSON.parse(r) : null; } catch (e) { return null; }
}
function saveProgress(tk, ans, startedAt) {
  try { localStorage.setItem('tools_prog_' + tk, JSON.stringify({ answers: ans, startedAt: startedAt })); } catch (e) {}
}
function clearProgress(tk) {
  try { localStorage.removeItem('tools_prog_' + tk); } catch (e) {}
}

var OPTS = [{ v: 'yes', label: 'Да' }, { v: 'maybe', label: 'Может быть' }, { v: 'no', label: 'Нет' }];

  {n:110,text:"Верно ли, что после неожиданного происшествия или аварии вы некоторое время не можете успокоиться и прийти в себя?"},

  {n:153,text:"Правда ли, что у вас небольшой круг интересов и видов деятельности, которыми вы занимаетесь по собственному желанию?"},

  {n:156,text:"Верно ли, что в сложных эмоциональных ситуациях вы полагаетесь на свой здравый смысл?"},

  {n:191,text:"Бывает ли, что вы предпочитаете не браться за задачу, чтобы не отвечать за результат?"},
  {n:192,text:"Верно ли, что замечания в свой адрес вы воспринимаете болезненно даже наедине?"},
  {n:193,text:"Склонны ли вы объяснять срыв срока действиями других людей?"},
  {n:194,text:"Верно ли, что вам спокойнее работать, когда решение принял кто-то другой?"},
  {n:195,text:"Верно ли, что чужие переживания редко вас трогают?"},
  {n:196,text:"Считаете ли вы, что на работе эмоциям коллег не место?"},
  {n:197,text:"Верно ли, что вам проще разобраться в цифрах, чем в настроении собеседника?"},
  {n:198,text:"Верно ли, что в новом коллективе вы долго держитесь в стороне?"},
  {n:199,text:"Предпочитаете ли вы написать сообщение вместо того, чтобы позвонить или подойти?"},
  {n:200,text:"Верно ли, что после дня, полного общения, вам необходимо побыть одному?"}
];
var STATE = { token: '', order: [], answers: {}, startedAt: 0, submitting: false };

function render(container, invite) {
  var total = STATE.order.length;
  var cards = STATE.order.map(function (q, idx) {
    var cur = STATE.answers[q.n];
    var opts = OPTS.map(function (o) {
      return '<button type="button" class="tl-opt' + (cur === o.v ? ' tl-opt--sel' : '') +
        '" data-q="' + q.n + '" data-v="' + o.v + '">' + o.label + '</button>';
    }).join('');
    return '<div class="tl-q' + (cur ? ' tl-q--done' : '') + '" id="tq' + q.n + '">' +
      '<div class="tl-num">' + (idx + 1) + '</div>' +
      '<div class="tl-body">' +
        '<div class="tl-text">' + escH(q.text) + '</div>' +
        '<div class="tl-opts">' + opts + '</div>' +
      '</div></div>';
  }).join('');

  container.innerHTML =
    '<div class="tl-wrap">' +
      '<div class="tl-hdr">' +
        '<div class="tl-logo">Т</div>' +
        '<div>' +
          '<h1 class="tl-title">Опросник по оценке личных качеств</h1>' +
          '<p class="tl-sub">Здравствуйте, <b>' + escH(invite.candidate_name || 'участник') + '</b>! ' +
          'В опроснике ' + total + ' утверждений о рабочих привычках и типичных ситуациях.</p>' +
        '</div>' +
      '</div>' +
      '<div class="tl-instr">Правильных и неправильных ответов здесь нет — отвечайте так, как есть на самом деле, ' +
        'не задумываясь подолгу над каждым пунктом. Ответы сохраняются автоматически: при необходимости можно ' +
        'закрыть страницу и продолжить позже с того же места.</div>' +
      '<div class="tl-bar"><div class="tl-bar-in">' +
        '<div class="tl-pbar"><div class="tl-pfill" id="tl-pfill"></div></div>' +
        '<span class="tl-pcnt" id="tl-pcnt">0 / ' + total + '</span>' +
        '<button type="button" class="tl-jump" id="tl-jump">К первому без ответа</button>' +
      '</div></div>' +
      '<div id="tl-list">' + cards + '</div>' +
      '<div class="tl-footer">' +
        '<div id="tl-err" class="tl-err" style="display:none"></div>' +
        '<button type="button" class="tl-submit" id="tl-submit">Отправить ответы →</button>' +
      '</div>' +
    '</div>';

  document.getElementById('tl-list').addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('.tl-opt') : null;
    if (!b) return;
    var n = Number(b.dataset.q), v = b.dataset.v;
    STATE.answers[n] = v;
    saveProgress(STATE.token, STATE.answers, STATE.startedAt);
    var card = document.getElementById('tq' + n);
    if (card) {
      card.classList.add('tl-q--done');
      card.querySelectorAll('.tl-opt').forEach(function (el) {
        el.classList.toggle('tl-opt--sel', el.dataset.v === v);
      });
    }
    updateProgress();
  });
  document.getElementById('tl-jump').addEventListener('click', jumpToFirstUnanswered);
  document.getElementById('tl-submit').addEventListener('click', submitForm);
  updateProgress();
}

function answeredCount() {
  return STATE.order.filter(function (q) { return STATE.answers[q.n]; }).length;
}

function updateProgress() {
  var total = STATE.order.length, done = answeredCount();
  var pf = document.getElementById('tl-pfill');
  var pc = document.getElementById('tl-pcnt');
  if (pf) pf.style.width = (total ? Math.round(done / total * 100) : 0) + '%';
  if (pc) pc.textContent = done + ' / ' + total;
  var jump = document.getElementById('tl-jump');
  if (jump) jump.style.display = (done === total) ? 'none' : '';
}

function jumpToFirstUnanswered() {
  for (var i = 0; i < STATE.order.length; i++) {
    var q = STATE.order[i];
    if (!STATE.answers[q.n]) {
      var el = document.getElementById('tq' + q.n);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
  }
}

async function submitForm() {
  if (STATE.submitting) return;
  var total = STATE.order.length, done = answeredCount();
  var errEl = document.getElementById('tl-err');
  if (done < total) {
    if (errEl) {
      errEl.textContent = 'Пожалуйста, ответьте на все утверждения. Осталось без ответа: ' + (total - done) + ' из ' + total + '.';
      errEl.style.display = '';
    }
    jumpToFirstUnanswered();
    return;
  }
  STATE.submitting = true;
  var btn = document.getElementById('tl-submit');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Отправляем…'; }
  var dur = STATE.startedAt ? Math.round((Date.now() - STATE.startedAt) / 1000) : 0;
  var res = await callApi('submitToolsSurvey', { token: STATE.token, answers: STATE.answers, duration_sec: dur });
  if (res && res.ok) {
    clearProgress(STATE.token);
    document.getElementById('tl-pg').innerHTML =
      '<div class="tl-msg tl-msg--ok"><div class="tl-msg-ico">✓</div>' +
        '<h2>Опрос завершён!</h2><p>Ваши ответы успешно сохранены. Спасибо за уделённое время!</p></div>';
  } else {
    STATE.submitting = false;
    if (btn) { btn.disabled = false; btn.innerHTML = 'Отправить ответы →'; }
    if (errEl) { errEl.textContent = (res && res.error) || 'Не удалось отправить. Попробуйте снова.'; errEl.style.display = ''; }
  }
}

async function init() {
  var container = document.getElementById('tl-pg');
  var qs;
  try { qs = new URLSearchParams(location.search); } catch (e) { qs = { get: function () { return null; } }; }
  var token = qs.get('tools_token');
  if (!token) {
    container.innerHTML = '<div class="tl-msg tl-msg--err"><div class="tl-msg-ico">⚠</div>' +
      '<h2>Ссылка недействительна</h2><p>Токен не найден. Перейдите по ссылке из письма.</p></div>';
    return;
  }
  STATE.token = token;
  var res = await callApi('startToolsSurvey', { token: token });
  if (!res || !res.ok) {
    if (res && res.already_done) {
      container.innerHTML = '<div class="tl-msg tl-msg--ok"><div class="tl-msg-ico">✓</div>' +
        '<h2>Опрос уже завершён</h2><p>Ваши ответы были сохранены ранее. Спасибо за участие!</p></div>';
    } else {
      container.innerHTML = '<div class="tl-msg tl-msg--err"><div class="tl-msg-ico">⚠</div>' +
        '<h2>' + escH(res && res.error ? res.error : 'Ссылка недействительна') + '</h2>' +
        '<p>Обратитесь к специалисту по подбору персонала.</p></div>';
    }
    return;
  }
  var saved = loadProgress(token);
  STATE.answers = (saved && saved.answers) ? saved.answers : {};
  STATE.startedAt = (saved && saved.startedAt) ? saved.startedAt : Date.now();
  saveProgress(token, STATE.answers, STATE.startedAt);
  STATE.order = seededShuffle(QUESTIONS, tokenSeed(token));
  render(container, res.invite || {});
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
